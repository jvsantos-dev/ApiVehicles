spring.application.name=vehicleapi

# ---------------------------------------------------------------
# Banco de dados (padrão: H2 em memória, sem instalação nenhuma).
# Para PostgreSQL, rode com o profile "postgres" (ver README).
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:fordcatalog;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# JWT
# Em produção sempre sobrescreva JWT_SECRET (mínimo 32 caracteres).
# ---------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:ford-catalog-dev-secret-change-me-please-32+chars}
app.jwt.expiration=${JWT_EXPIRATION:1h}
app.jwt.issuer=ford-vehicle-catalog-api

# Popula usuários de exemplo e catálogo inicial
app.seed.enabled=true

# ---------------------------------------------------------------
# CORS: front-ends autorizados a chamar a API pelo navegador
# (lista separada por vírgula; ex.: CORS_ALLOWED_ORIGINS=https://app.ford-catalog.dev)
# ---------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
app.cors.max-age=1h

# ---------------------------------------------------------------
# Web service externo: Tabela FIPE (preço de mercado)
# https://deividfortuna.github.io/fipe/  (marca 22 = Ford)
# ---------------------------------------------------------------
app.fipe.base-url=${FIPE_BASE_URL:https://parallelum.com.br/fipe/api/v1}
app.fipe.brand-code=22
app.fipe.connect-timeout=3s
app.fipe.read-timeout=5s

# ---------------------------------------------------------------
# OpenAPI / Swagger UI -> http://localhost:8080/swagger-ui.html
# ---------------------------------------------------------------
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
